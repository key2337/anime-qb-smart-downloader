app:
  database: "./data/app.db"
  log_level: "INFO"

qbittorrent:
  base_url: "http://127.0.0.1:8080"
  username: "YOUR_QB_USERNAME"
  password: "YOUR_QB_PASSWORD"

rss_sources:
  - name: "mikan"
    url: "https://YOUR_REAL_RSS_URL"
    enabled: true

search_sources:
  nyaa:
    enabled: false
    base_url: "https://nyaa.si"
    default_category: "1_2"
    timeout_seconds: 15

probe_policy:
  enabled: false
  max_candidates: 3
  duration_seconds: 30
  min_speed_kbps: 50
  delete_losers: true

