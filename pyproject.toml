[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anime-qb-smart-downloader"
version = "0.1.0"
description = "Anime RSS smart downloader for qBittorrent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "feedparser>=6.0.11",
  "PyYAML>=6.0.1",
  "requests>=2.31.0",
  "pydantic>=2.6.0",
  "loguru>=0.7.2",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.110.0",
  "uvicorn>=0.29.0",
]

[project.scripts]
aqsd = "aqsd.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
