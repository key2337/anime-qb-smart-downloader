app:
  database: "./data/app.db"
  interval_seconds: 300
  log_level: "INFO"

qbittorrent:
  base_url: "http://127.0.0.1:8080"
  username: "change-me"
  password: "change-me"
  default_category: "Anime"
  default_save_path: "/downloads/anime"

rss_sources:
  - name: "mikan"
    url: "https://example.com/rss.xml"
    enabled: true

search_sources:
  nyaa:
    enabled: true
    base_url: "https://nyaa.si"
    default_category: "1_2"
    timeout_seconds: 15
  torznab:
    enabled: false
    endpoints:
      - name: "jackett-nyaa"
        url: "http://127.0.0.1:9117/api/v2.0/indexers/nyaa/results/torznab/"
        api_key: "change-me"
        categories: []
        timeout_seconds: 15

metadata_sources:
  anilist:
    enabled: true
    endpoint: "https://graphql.anilist.co"
    timeout_seconds: 15
    cache_enabled: true
    cache_ttl_days: 30

fallback_policy:
  enabled: true
  check_after_minutes: 10
  min_download_speed_kbps: 100
  min_progress_delta: 0.001
  max_retry_candidates: 5
  delete_failed_torrent: true

probe_policy:
  enabled: false
  max_candidates: 3
  duration_seconds: 30
  min_speed_kbps: 50
  delete_losers: true

# Local multilingual search aliases for manual search/download.
title_aliases:
  - canonical: "一拳超人"
    aliases:
      - "一拳超人"
      - "一击男"
      - "One Punch Man"
      - "One-Punch Man"
      - "Wanpanman"
      - "ワンパンマン"
  - canonical: "Angel Beats!"
    aliases:
      - "天使的心跳"
      - "Angel Beats!"
      - "エンジェルビーツ"
  - canonical: "Apocalypse Hotel"
    aliases:
      - "末日后酒店"
      - "Apocalypse Hotel"
      - "アポカリプスホテル"
  - canonical: "Ruri no Houseki"
    aliases:
      - "琉璃的宝石"
      - "Ruri no Houseki"
      - "Ruri Rocks"
      - "瑠璃の宝石"

profiles:
  fastest:
    prefer:
      resolution: ["1080p", "2160p", "720p"]
      subtitle: "any"
    allow_fallback: true

  preferred_group:
    prefer:
      resolution: ["1080p", "720p"]
      subtitle: "embedded"
    allow_other_group: false
    allow_fallback: true
    wait_minutes_before_fallback: 60

  raw_only:
    must_include:
      - "1080p"
    prefer:
      - "RAW"
      - "WEB-DL"
    reject:
      - "CHS"
      - "CHT"
      - "embedded"
      - "external"
    allow_subtitled: false
    allow_fallback: true

  quality_first:
    prefer:
      resolution: ["2160p", "1080p"]
      source: ["WEB-DL", "BluRay"]
    allow_fallback: true
    wait_minutes_before_fallback: 120

anime:
  - name: "Example Anime"
    aliases:
      - "Example"
      - "Example Anime S1"
    profile: "fastest"
    include:
      - "1080p"
    reject:
      - "Batch"
      - "Complete"
    prefer_groups:
      - "LoliHouse"
      - "SubsPlease"
    save_path: "/downloads/anime/Example Anime"
    category: "Anime"
