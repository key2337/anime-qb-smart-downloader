app:
  database: "./data/app.db"
  interval_seconds: 300
  log_level: "INFO"

qbittorrent:
  base_url: "http://127.0.0.1:8080"
  username: "change-me"
  password: "change-me"
  default_category: "Anime"
  default_save_path: "/downloads/anime"

rss_sources:
  - name: "mikan"
    url: "https://example.com/rss.xml"
    enabled: true

fallback_policy:
  enabled: true
  check_after_minutes: 10
  min_download_speed_kbps: 100
  min_progress_delta: 0.001
  max_retry_candidates: 5
  delete_failed_torrent: true

probe_policy:
  enabled: false
  max_candidates: 3
  duration_seconds: 30
  min_speed_kbps: 50
  delete_losers: true

# Local multilingual search aliases for manual search/download.
title_aliases:
  - canonical: "一拳超人"
    aliases:
      - "一拳超人"
      - "一击男"
      - "One Punch Man"
      - "One-Punch Man"
      - "Wanpanman"
      - "ワンパンマン"

profiles:
  fastest:
    prefer:
      resolution: ["1080p", "2160p", "720p"]
      subtitle: "any"
    allow_fallback: true

  preferred_group:
    prefer:
      resolution: ["1080p", "720p"]
      subtitle: "embedded"
    allow_other_group: false
    allow_fallback: true
    wait_minutes_before_fallback: 60

  raw_only:
    must_include:
      - "1080p"
    prefer:
      - "RAW"
      - "WEB-DL"
    reject:
      - "CHS"
      - "CHT"
      - "embedded"
      - "external"
    allow_subtitled: false
    allow_fallback: true

  quality_first:
    prefer:
      resolution: ["2160p", "1080p"]
      source: ["WEB-DL", "BluRay"]
    allow_fallback: true
    wait_minutes_before_fallback: 120

anime:
  - name: "Example Anime"
    aliases:
      - "Example"
      - "Example Anime S1"
    profile: "fastest"
    include:
      - "1080p"
    reject:
      - "Batch"
      - "Complete"
    prefer_groups:
      - "LoliHouse"
      - "SubsPlease"
    save_path: "/downloads/anime/Example Anime"
    category: "Anime"
