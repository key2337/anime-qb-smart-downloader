<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AQSD 动漫搜索工作台</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="page">
    <header class="page-header">
      <div>
        <h1>AQSD 动漫搜索工作台</h1>
        <p class="subtitle">本地搜索、标题解析、评分解释，以及无结果时的排查建议。</p>
      </div>
    </header>

    <section class="card">
      <h2>运行状态</h2>
      <div id="health-status" class="status-row">正在读取运行状态...</div>
    </section>

    <section class="card">
      <h2>搜索条件</h2>
      <div id="form-error" class="message error hidden"></div>
      <form id="search-form">
        <div class="toolbar">
          <input id="query" name="query" type="text" placeholder="输入动漫标题" autocomplete="off">
          <button type="submit" class="button button-primary" id="search-button">搜索</button>
        </div>

        <div class="grid">
          <label>
            <span>集数</span>
            <input id="episode" name="episode" type="text" placeholder="例如 01 或 21">
          </label>
          <label>
            <span>季度</span>
            <input id="season" name="season" type="text" placeholder="例如 2">
          </label>
          <label>
            <span>分辨率</span>
            <select id="resolution" name="resolution">
              <option value="">不限</option>
              <option value="720p">720p</option>
              <option value="1080p">1080p</option>
              <option value="2160p">2160p</option>
            </select>
          </label>
          <label>
            <span>字幕类型</span>
            <select id="subtitle" name="subtitle">
              <option value="">不限</option>
              <option value="embedded">内嵌字幕</option>
              <option value="external">外挂字幕</option>
              <option value="none">RAW / 无字幕</option>
            </select>
          </label>
          <label>
            <span>字幕组</span>
            <input id="group" name="group" type="text" placeholder="例如 LoliHouse">
          </label>
          <label>
            <span>资源类型</span>
            <select id="release-mode" name="release_mode">
              <option value="any">不限</option>
              <option value="episode">单集</option>
              <option value="batch">合集 / 整季</option>
            </select>
          </label>
          <label>
            <span>结果数量</span>
            <input id="limit" name="limit" type="number" min="1" max="100" value="20">
          </label>
        </div>

      </form>
    </section>

    <section class="card">
      <h2>标题扩展结果</h2>
      <div id="expanded-queries" class="list-block muted">还没有解析过标题。</div>
    </section>

    <section class="card">
      <h2>搜索结果</h2>
      <div id="loading" class="message loading hidden">正在搜索...</div>
      <div id="results" class="results-list muted">执行一次搜索后，这里会显示候选资源。</div>
    </section>

    <section class="card">
      <h2>搜索诊断</h2>
      <div id="diagnostics" class="muted">诊断信息会在搜索后显示。</div>
    </section>

    <section class="card" id="cart-section">
      <h2>下载队列</h2>
      <div id="carts" class="muted">暂无下载任务。搜索后勾选候选，点击"加入下载队列"。</div>
    </section>

    <section class="card" id="subscription-section">
      <h2>追番管理</h2>
      <div class="toolbar">
        <span id="subscription-status" class="muted"></span>
        <button id="sub-add-button" class="button">添加追番</button>
        <button id="sub-check-all-button" class="button">全部检查</button>
      </div>
      <div id="subscriptions" class="muted">暂无追番订阅。点击"添加追番"开始。</div>
      <div id="subscription-events"></div>
    </section>

    <div id="sub-modal" class="modal hidden">
      <div class="modal-content">
        <h3>添加追番</h3>
        <label><span>名称</span><input id="sub-name" type="text" placeholder="番剧名称"></label>
        <label><span>RSS 源</span><select id="sub-source"><option value="">默认（第一个启用的源）</option></select></label>
        <label><span>匹配规则</span><select id="sub-match"><option value="">使用番剧名称匹配</option></select></label>
        <label><span>集数偏移</span><input id="sub-offset" type="number" value="0"></label>
        <div class="toolbar">
          <button id="sub-save-button" class="button button-primary">保存</button>
          <button id="sub-cancel-button" class="button">取消</button>
        </div>
        <div id="sub-modal-error" class="message error hidden"></div>
      </div>
    </div>
  </main>

  <script src="/app.js?v=10"></script>
</body>
</html>
